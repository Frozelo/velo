[package]
name = "velo-native"
version = "0.1.0-alpha.2"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
gtk = { package = "gtk4", version = "0.10" }
pipewire = { version = "0.10", features = ["v0_3_44"] }
evdev = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "rustls"] }
serde_json = "1"
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
